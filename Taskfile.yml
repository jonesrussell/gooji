version: '3'

vars:
  BINARY_NAME: gooji

tasks:
  default:
    cmds:
      - task --list

  dev:
    desc: Start Go server and Vite dev server concurrently
    deps:
      - task: dev:frontend
    cmds:
      - task: dev:backend

  dev:backend:
    desc: Run Go server with Air hot reload
    cmds:
      - APP_ENV=development VITE_DEV=true go run github.com/air-verse/air@latest

  dev:frontend:
    desc: Run Vite dev server
    dir: web
    cmds:
      - npm run dev
    ignore_error: true

  build:
    desc: Build production binary and frontend
    cmds:
      - task: build:frontend
      - task: build:backend

  build:frontend:
    desc: Build frontend for production
    dir: web
    cmds:
      - npm run build

  build:backend:
    desc: Build Go binary
    cmds:
      - go build -o bin/{{.BINARY_NAME}} main.go

  run:
    desc: Run the production binary
    cmds:
      - ./bin/{{.BINARY_NAME}}

  test:
    desc: Run all tests
    cmds:
      - go test -v -race -cover ./internal/...

  test:coverage:
    desc: Generate coverage report
    cmds:
      - go test -coverprofile=coverage.out ./internal/...
      - go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Run linters
    cmds:
      - go vet ./...
      - go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  format:
    desc: Format Go code
    cmds:
      - go fmt ./...

  migrate:data:
    desc: Migrate JSON metadata to SQLite (one-time)
    cmds:
      - go run cmd/migrate/main.go

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/ web/dist/ coverage.out coverage.html

  setup:
    desc: Set up development environment
    cmds:
      - go mod download
      - cd web && npm install

  check-ffmpeg:
    desc: Check FFmpeg installation
    cmds:
      - ffmpeg -version

  security-scan:
    desc: Run security vulnerability scan
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy
      - go mod verify
